<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektra Motos | Promociones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page="promociones" data-base="..">
  <div data-site-header></div>

  <main>
    <section class="page-hero section-pad">
      <div class="container-fluid">
          <!-- TITULO -->
          <div class="row align-items-center mb-5 pb-5">
            <div class="col-9">
              <h2 class="history-title"> ULTIMA  <br><span>MOTO O PROMOCIONAL</span></h2>
            </div>
            <div class="col-3 text-end">
              <img src="#" class="title-icon" alt="">
            </div>
          </div>
      </div>
    </section>
<section class="promotions-section py-4 py-md-5">

  <div class="container-fluid">

    <!-- TITULO -->
    <div class="row mb-3 mb-md-4">
      <div class="col-12">
        <h2 class="promo-main-title">
          NUESTRAS <span>PROMOCIONES</span>
        </h2>
      </div>
    </div>

    <!-- ========================================= -->
    <!-- LAYOUT -->
    <!-- ========================================= -->

    <div class="row">

      <!-- FILTRO -->
      <div class="col-12 col-md-2 mb-4 mb-md-0">

        <aside class="promo-filter">

          <div class="promo-filter-header">
            FILTROS
          </div>

          <!-- MOBILE -->
          <div class="d-flex d-md-block promo-filter-mobile">

            <button class="promo-filter-btn">
              POR MARCA
            </button>

            <button class="promo-filter-btn">
              POR TIPO
            </button>

            <button class="promo-filter-btn">
              POR MODELO
            </button>

          </div>

        </aside>

      </div>


      <!-- PRODUCTOS -->
      <div class="col-12 col-md-10">

        <div class="row g-4">

          <!-- CARD -->
          <div class="col-12 col-sm-6 col-md-4 col-xl-3">

            <article class="promo-card">

              <div class="image-placeholder image-placeholder-card">
                <img src="../assets/img/imagen moto (1).png" alt="">
              </div>

              <span class="promo-badge">%</span>

              <div class="promo-copy">

                <div class="price-wrap">
                  <span class="price-old">$52,999</span>
                  <span class="price-new">$42,999</span>
                </div>

                <h3>
                  Motocicleta Italika Firebird 300
                </h3>

              </div>

            </article>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>  </main>

  <div data-site-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
